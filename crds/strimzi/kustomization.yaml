apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/strimzi/strimzi-kafka-operator/releases/download/1.3.0/strimzi-cluster-operator-1.3.0.yaml
# Direct kubectl installs can apply this package before the application stack.
# Argo CD selects the same upstream CRD files in argocd/strimzi-crds.yaml.
patches:
  - target:
      kind: (Deployment|ConfigMap|ServiceAccount|ClusterRole|ClusterRoleBinding|RoleBinding)
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: operator-resources
