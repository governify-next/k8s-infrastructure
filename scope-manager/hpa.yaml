apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: governify-scope-manager
  namespace: governify-next
  labels:
    app: governify-scope-manager
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: governify-scope-manager
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75