apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: governify-grafana
  name: governify-grafana
  namespace: governify-next
spec:
  replicas: 1
  selector:
    matchLabels:
      app: governify-grafana
  template:
    metadata:
      labels:
        app: governify-grafana
    spec:
      containers:
        - name: governify-grafana
          image: grafana/grafana:latest
          imagePullPolicy: Always
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_DEFAULT_THEME
              value: light
            - name: GF_SERVER_ROOT_URL
              value: http://localhost:3000
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: governify-grafana
