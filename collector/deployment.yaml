apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: governify-collector
  name: governify-collector
  namespace: governify-next
spec:
  replicas: 2
  selector:
    matchLabels:
      app: governify-collector
  template:
    metadata:
      labels:
        app: governify-collector
    spec:
      containers:
        - env:
            - name: NODE_ENV
              value: development
            - name: GOV_LOG_LEVEL
              value: INFO
            - name: PORT
              value: "5804"
            - name: GOV_SERVICE_NAME
              value: "collector"
            - name: MONGO_URI
              value: "mongodb://governify-mongo:27017/governify"
            - name: SERVICE_AUTHENTICATION_ENABLED
              value: "false"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: governify-secrets
                  key: jwt_secret

          image: governifynext/collector:develop
          imagePullPolicy: Always
          name: governify-collector
          ports:
            - containerPort: 5804
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 300Mi
            limits:
              cpu: 500m
              memory: 400Mi