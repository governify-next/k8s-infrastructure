apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: governify-reporter
  name: governify-reporter
  namespace: governify-next
spec:
  replicas: 1
  selector:
    matchLabels:
      app: governify-reporter
  template:
    metadata:
      labels:
        app: governify-reporter
    spec:
      containers:
        - env:
            - name: NODE_ENV
              value: development
            - name: GOV_LOG_LEVEL
              value: INFO
            - name: PORT
              value: "5805"
            - name: GOV_SERVICE_NAME
              value: "reporter"
            - name: REGISTRY_SERVICE_URL
              value: "http://governify-registry:5802"
            - name: MONGO_URI
              value: "mongodb://governify-mongo:27017/governify"
            - name: SERVICE_AUTHENTICATION_ENABLED
              value: "false"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: governify-secrets
                  key: jwt_secret
            - name: INFLUX_URL
              value: http://governify-influxdb3:8181
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: governify-secrets
                  key: influx_token
            - name: INFLUX_DATABASE
              value: governify-next
            - name: INFLUX_WRITE_PRECISION
              value: millisecond
            - name: INFLUX_MAX_FAST_RETRIES
              value: "5"
            - name: INFLUX_RETRY_FAST_DELAY_MS
              value: "1000"
            - name: INFLUX_SLOW_RECONNECTION_MAX_RETRIES
              value: "10"
            - name: INFLUX_SLOW_RECONNECTION_STRATEGY
              value: "true"
            - name: INFLUX_RETRY_SLOW_DELAY_MS
              value: "10000"
            - name: INFLUX_HEALTHCHECK_INTERVAL_MS
              value: "10000"
            - name: INFLUX_HEALTHCHECK_TIMEOUT_MS
              value: "3000"
            - name: GRAFANA_URL
              value: http://governify-grafana:3000
            - name: GRAFANA_PUBLIC_URL
              value: http://reporter.k8s.next.governify.io:3000
            - name: GRAFANA_USER
              valueFrom:
                secretKeyRef:
                  name: governify-secrets
                  key: grafana_user
            - name: GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: governify-secrets
                  key: grafana_password
            - name: GRAFANA_INFLUX_URL
              value: http://governify-influxdb3:8181
            - name: GRAFANA_DATASOURCE_UID
              value: governify-influxdb3
            - name: GRAFANA_DATASOURCE_NAME
              value: Governify InfluxDB 3
            - name: GRAFANA_FOLDER_UID
              value: governify
            - name: GRAFANA_FOLDER_TITLE
              value: Governify
          image: governifynext/reporter:develop
          imagePullPolicy: Always
          name: governify-reporter
          ports:
            - containerPort: 5805
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 300Mi
            limits:
              cpu: 500m
              memory: 400Mi