apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: governify-reporter
  namespace: governify-next
  labels:
    app: governify-reporter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: governify-reporter
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75