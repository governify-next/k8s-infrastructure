apiVersion: apps/v1
kind: Deployment
metadata:
  name: governify-authenticator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: governify-authenticator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governify-authenticator
    spec:
      containers:
        - name: authenticator
          image: governifynext/authenticator:develop
          ports:
            - {name: http, containerPort: 5800}
          env:
            - {name: AUTHENTICATOR_SERVICE_URL, value: "http://governify-authenticator:5800"}
            - {name: PORT, value: "5800"}
            - {name: GOV_SERVICE_NAME, value: authenticator}
            - {name: MONGO_URI, value: "mongodb://governify-mongo:27017/governify"}
            - {name: DEFAULT_ADMIN_USERNAME, value: admin}
            - name: DEFAULT_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: governify-secrets, key: authenticator_admin_password}}
            - name: SCOPE_MANAGER_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: scope_manager_client_secret}}
            - name: REGISTRY_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: registry_client_secret}}
            - name: COMPUTER_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: computer_client_secret}}
            - name: FETCHER_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: fetcher_client_secret}}
            - name: REPORTER_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: reporter_client_secret}}
            - name: DIRECTOR_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: director_client_secret}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: jwt_secret}}
            - {name: JWT_ISSUER, value: authenticator}
            - {name: JWT_AUDIENCE, value: governify-next}
            - {name: OIDC_ENABLED, value: "true"}
            - {name: OIDC_ISSUER_URL, value: "https://accounts.google.com"}
            - name: OIDC_CLIENT_ID
              valueFrom: {secretKeyRef: {name: governify-secrets, key: oidc_client_id}}
            - name: OIDC_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: oidc_client_secret}}
            - {name: OIDC_REDIRECT_URI, value: "https://authenticator.k8s.next.governify.io/api/v1/users/oidc/callback"}
            - {name: OIDC_SCOPE, value: "openid email profile"}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: governify-authenticator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    app.kubernetes.io/name: governify-authenticator
  ports:
    - {name: http, port: 5800, targetPort: http}
