apiVersion: apps/v1
kind: Deployment
metadata:
  name: governify-join-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: governify-join-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governify-join-frontend
    spec:
      containers:
        - name: join-frontend
          image: governifynext/join-frontend:develop
          imagePullPolicy: Always
          env:
            - {name: NODE_ENV, value: production}
            - {name: PORT, value: "3000"}
            - {name: AUTHENTICATOR_SERVICE_URL, value: "http://governify-authenticator:5800"}
            - {name: JOIN_BACKEND_URL, value: "http://governify-join-backend:5807"}
            - {name: GOVERNIFY_FRONTEND_URL, value: "https://frontend.k8s.next.governify.io"}
            - {name: AUTH_ACCESS_COOKIE_NAME, value: governify_next_access_token}
            - {name: AUTH_REFRESH_COOKIE_NAME, value: governify_next_refresh_token}
            - {name: ACCESS_TOKEN_MAX_AGE, value: "900"}
            - {name: REFRESH_TOKEN_MAX_AGE, value: "604800"}
          ports:
            - {name: http, containerPort: 3000}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: governify-join-frontend
spec:
  selector:
    app.kubernetes.io/name: governify-join-frontend
  ports:
    - {name: http, port: 3000, targetPort: http}
