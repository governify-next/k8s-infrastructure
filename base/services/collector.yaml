apiVersion: apps/v1
kind: Deployment
metadata:
  name: governify-fetcher
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: governify-fetcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governify-fetcher
    spec:
      containers:
        - name: fetcher
          image: governifynext/fetcher:develop
          env:
            - {name: SERVICE_AUTHENTICATION_ENABLED, value: "true"}
            - {name: PORT, value: "5804"}
            - {name: GOV_SERVICE_NAME, value: fetcher}
            - {name: MONGO_URI, value: "mongodb://governify-mongo:27017/governify"}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: jwt_secret}}
---
apiVersion: v1
kind: Service
metadata:
  name: governify-fetcher
spec:
  selector:
    app.kubernetes.io/name: governify-fetcher
  ports:
    - {port: 5804}
