apiVersion: apps/v1
kind: Deployment
metadata:
  name: governify-reporter
spec:
  replicas: 2
  selector:
    matchLabels: 
      app.kubernetes.io/name: governify-reporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governify-reporter
    spec:
      containers:
        - name: reporter
          image: governifynext/reporter:develop
          env:
            - {name: SERVICE_AUTHENTICATION_ENABLED, value: "true"}
            - {name: NODE_ENV, value: production}
            - {name: GOV_LOG_LEVEL, value: INFO}
            - {name: AUTHENTICATOR_SERVICE_URL, value: "http://governify-authenticator:5800"}
            - {name: CLIENT_ID, value: reporter}
            - name: CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: reporter_client_secret}}
            - {name: PORT, value: "5805"}
            - {name: GOV_SERVICE_NAME, value: reporter}
            - {name: REGISTRY_SERVICE_URL, value: "http://governify-registry:5802"}
            - {name: SCOPE_MANAGER_SERVICE_URL, value: "http://governify-scope-manager:5801"}
            - {name: DIRECTOR_SERVICE_URL, value: "http://governify-director:5806"}
            - {name: MONGO_URI, value: "mongodb://governify-mongo:27017/governify"}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: jwt_secret}}
            - {name: JWT_ISSUER, value: authenticator}
            - {name: JWT_AUDIENCE, value: governify-next}
            - {name: INFLUX_URL, value: "http://governify-influxdb3:8181"}
            - name: INFLUX_TOKEN
              valueFrom: {secretKeyRef: {name: governify-secrets, key: influx_token}}
            - {name: INFLUX_DATABASE, value: governify-next}
            - {name: INFLUX_WRITE_PRECISION, value: millisecond}
            - {name: INFLUX_WRITE_BATCH_MAX_POINTS, value: "5000"}
            - {name: INFLUX_WRITE_BATCH_MAX_BYTES, value: "8388608"}
            - {name: INFLUX_MAX_FAST_RETRIES, value: "5"}
            - {name: INFLUX_RETRY_FAST_DELAY_MS, value: "1000"}
            - {name: INFLUX_SLOW_RECONNECTION_MAX_RETRIES, value: "10"}
            - {name: INFLUX_SLOW_RECONNECTION_STRATEGY, value: "false"}
            - {name: INFLUX_RETRY_SLOW_DELAY_MS, value: "10000"}
            - {name: INFLUX_HEALTHCHECK_INTERVAL_MS, value: "10000"}
            - {name: INFLUX_HEALTHCHECK_TIMEOUT_MS, value: "3000"}
            - {name: GRAFANA_URL, value: "http://governify-grafana:3000"}
            - {name: GRAFANA_PUBLIC_URL, value: "https://grafana.k8s.next.governify.io"}
            - name: GRAFANA_USER
              valueFrom: {secretKeyRef: {name: governify-secrets, key: grafana_user}}
            - name: GRAFANA_PASSWORD
              valueFrom: {secretKeyRef: {name: governify-secrets, key: grafana_password}}
            - {name: GRAFANA_INFLUX_URL, value: "http://governify-influxdb3:8181"}
            - {name: GRAFANA_DATASOURCE_UID, value: governify-influxdb3}
            - {name: GRAFANA_DATASOURCE_NAME, value: "Governify InfluxDB 3"}
            - {name: GRAFANA_FOLDER_UID, value: governify}
            - {name: GRAFANA_FOLDER_TITLE, value: Governify}
            # OAS telemetry: each service can override its own exporters and retention.
            - {name: OTEL_SERVICE_NAME, value: reporter}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=governify-next-pre-production"}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom: {secretKeyRef: {name: governify-secrets, key: telemetry_otel_exporter_otlp_endpoint}}
            - {name: OASTLM_CONFIG_GENERAL_SPEC_FILE_NAME, value: "./src/docs/swagger.yaml"}
            - {name: OASTLM_CONFIG_TRACES_CAPTURE_BODY_MODE, value: onMismatchOrError}
            - {name: OASTLM_CONFIG_METRICS_RECORD_SCHEMA_COMPLIANCE, value: "true"}
            - {name: OASTLM_CONFIG_AUTH_ENABLED, value: "true"}
            - name: OASTLM_CONFIG_AUTH_PASSWORD
              valueFrom: {secretKeyRef: {name: governify-secrets, key: telemetry_oastlm_config_auth_password}}
            - name: OASTLM_CONFIG_AUTH_JWT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: telemetry_oastlm_config_auth_jwt_secret}}
            - {name: OASTLM_CONFIG_TRACES_MEMORY_EXPORTER_RETENTION_TIME_SECONDS, value: "36000"}
            - {name: OASTLM_CONFIG_METRICS_MAIN_READER_EXPORT_INTERVAL, value: "60000"}
            - {name: OASTLM_CONFIG_METRICS_MEMORY_EXPORTER_RETENTION_TIME_SECONDS, value: "172800"}
            - {name: OASTLM_CONFIG_LOGS_MEMORY_EXPORTER_RETENTION_TIME_SECONDS, value: "86400"}
            - name: OASTLM_CONFIG_AI_OPENAI_KEY
              valueFrom: {secretKeyRef: {name: governify-secrets, key: telemetry_oastlm_config_ai_openai_key}}
---
apiVersion: v1
kind: Service
metadata:
  name: governify-reporter
spec:
  selector: {app.kubernetes.io/name: governify-reporter}
  ports:
    - {port: 5805}
