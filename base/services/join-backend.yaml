apiVersion: apps/v1
kind: Deployment
metadata:
  name: governify-join-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: governify-join-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governify-join-backend
    spec:
      containers:
        - name: join-backend
          image: governifynext/join-backend:develop
          env:
            - {name: PORT, value: "5807"}
            - {name: GOV_SERVICE_NAME, value: join-backend}
---
apiVersion: v1
kind: Service
metadata:
  name: governify-join-backend
spec:
  selector:
    app.kubernetes.io/name: governify-join-backend
  ports:
    - {port: 5807}