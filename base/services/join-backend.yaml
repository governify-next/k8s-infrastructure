apiVersion: apps/v1
kind: Deployment
metadata:
  name: governify-join-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: governify-join-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governify-join-backend
    spec:
      containers:
        - name: join-backend
          image: governifynext/join-backend:develop
          imagePullPolicy: Always
          env:
            - {name: NODE_ENV, value: production}
            - {name: PORT, value: "5807"}
            - {name: GOV_SERVICE_NAME, value: join-backend}
            - {name: GOV_LOG_LEVEL, value: INFO}
            - {name: MONGO_URI, value: "mongodb://governify-mongo:27017/governify"}
            - {name: FRONTEND_URL, value: "https://join.k8s.next.governify.io"}
            - {name: GOVERNIFY_FRONTEND_URL, value: "https://frontend.k8s.next.governify.io"}
            - {name: AUTHENTICATOR_SERVICE_URL, value: "http://governify-authenticator:5800"}
            - {name: CLIENT_ID, value: join-backend}
            - name: CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: join_backend_client_secret}}
            - {name: SCOPE_MANAGER_SERVICE_URL, value: "http://governify-scope-manager:5801"}
            - {name: REGISTRY_SERVICE_URL, value: "http://governify-registry:5802"}
            - {name: REPORTER_SERVICE_URL, value: "http://governify-reporter:5805"}
            - {name: DIRECTOR_SERVICE_URL, value: "http://governify-director:5806"}
            - {name: WORKER_LEASE_MS, value: "300000"}
            - {name: WORKER_INTERVAL_MS, value: "2000"}
            - {name: ONBOARDING_TTL_SECONDS, value: "86400"}
            - {name: RESTRICT_ONBOARDING_PER_REPOSITORY, value: "false"}
            - {name: GITHUB_APP_SLUG, value: governify-next-pre-production}
            - {name: GITHUB_API_URL, value: "https://api.github.com"}
            - {name: GITHUB_CALLBACK_URL, value: "https://join-backend.k8s.next.governify.io/api/v1/integrations/github/callback"}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: jwt_secret}}
            - name: GITHUB_APP_ID
              valueFrom: {secretKeyRef: {name: governify-secrets, key: github_app_id}}
            - name: GITHUB_APP_CLIENT_ID
              valueFrom: {secretKeyRef: {name: governify-secrets, key: github_app_client_id}}
            - name: GITHUB_APP_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: github_app_client_secret}}
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom: {secretKeyRef: {name: governify-secrets, key: github_app_private_key}}
            # OAS telemetry: each service can override its own exporters and retention.
            - {name: OTEL_SERVICE_NAME, value: join-backend}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=governify-next-pre-production"}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom: {secretKeyRef: {name: governify-secrets, key: telemetry_otel_exporter_otlp_endpoint}}
            - {name: OASTLM_CONFIG_GENERAL_SPEC_FILE_NAME, value: "./src/docs/swagger.yaml"}
            - {name: OASTLM_CONFIG_TRACES_CAPTURE_BODY_MODE, value: onMismatchOrError}
            - {name: OASTLM_CONFIG_METRICS_RECORD_SCHEMA_COMPLIANCE, value: "true"}
            - {name: OASTLM_CONFIG_AUTH_ENABLED, value: "true"}
            - name: OASTLM_CONFIG_AUTH_PASSWORD
              valueFrom: {secretKeyRef: {name: governify-secrets, key: telemetry_oastlm_config_auth_password}}
            - name: OASTLM_CONFIG_AUTH_JWT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: telemetry_oastlm_config_auth_jwt_secret}}
            - {name: OASTLM_CONFIG_TRACES_MEMORY_EXPORTER_RETENTION_TIME_SECONDS, value: "36000"}
            - {name: OASTLM_CONFIG_METRICS_MAIN_READER_EXPORT_INTERVAL, value: "60000"}
            - {name: OASTLM_CONFIG_METRICS_MEMORY_EXPORTER_RETENTION_TIME_SECONDS, value: "172800"}
            - {name: OASTLM_CONFIG_LOGS_MEMORY_EXPORTER_RETENTION_TIME_SECONDS, value: "86400"}
            - name: OASTLM_CONFIG_AI_OPENAI_KEY
              valueFrom: {secretKeyRef: {name: governify-secrets, key: telemetry_oastlm_config_ai_openai_key}}
          ports:
            - {name: http, containerPort: 5807}
          startupProbe:
            httpGet: {path: /ready, port: http}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: governify-join-backend
spec:
  selector:
    app.kubernetes.io/name: governify-join-backend
  ports:
    - {name: http, port: 5807, targetPort: http}
