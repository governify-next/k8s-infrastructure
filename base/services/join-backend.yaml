apiVersion: apps/v1
kind: Deployment
metadata:
  name: governify-join-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: governify-join-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governify-join-backend
    spec:
      containers:
        - name: join-backend
          image: governifynext/join-backend:develop
          imagePullPolicy: Always
          env:
            - {name: NODE_ENV, value: production}
            - {name: PORT, value: "5807"}
            - {name: GOV_SERVICE_NAME, value: join-backend}
            - {name: GOV_LOG_LEVEL, value: INFO}
            - {name: MONGO_URI, value: "mongodb://governify-mongo:27017/governify"}
            - {name: FRONTEND_URL, value: "https://join.k8s.next.governify.io"}
            - {name: AUTHENTICATOR_SERVICE_URL, value: "http://governify-authenticator:5800"}
            - {name: CLIENT_ID, value: join-backend}
            - name: CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: join_backend_client_secret}}
            - {name: SCOPE_MANAGER_SERVICE_URL, value: "http://governify-scope-manager:5801"}
            - {name: REGISTRY_SERVICE_URL, value: "http://governify-registry:5802"}
            - {name: DIRECTOR_SERVICE_URL, value: "http://governify-director:5806"}
            - {name: WORKER_LEASE_MS, value: "300000"}
            - {name: WORKER_INTERVAL_MS, value: "2000"}
            - {name: ONBOARDING_TTL_SECONDS, value: "86400"}
            - {name: GITHUB_APP_SLUG, value: governify-next}
            - {name: GITHUB_API_URL, value: "https://api.github.com"}
            - {name: GITHUB_CALLBACK_URL, value: "https://join-backend.k8s.next.governify.io/api/v1/integrations/github/callback"}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: jwt_secret}}
            - name: GITHUB_APP_ID
              valueFrom: {secretKeyRef: {name: governify-secrets, key: github_app_id}}
            - name: GITHUB_APP_CLIENT_ID
              valueFrom: {secretKeyRef: {name: governify-secrets, key: github_app_client_id}}
            - name: GITHUB_APP_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: github_app_client_secret}}
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom: {secretKeyRef: {name: governify-secrets, key: github_app_private_key}}
          ports:
            - {name: http, containerPort: 5807}
          startupProbe:
            httpGet: {path: /ready, port: http}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: governify-join-backend
spec:
  selector:
    app.kubernetes.io/name: governify-join-backend
  ports:
    - {name: http, port: 5807, targetPort: http}
