apiVersion: apps/v1
kind: Deployment
metadata:
  name: governify-registry
spec:
  replicas: 2
  selector:
    matchLabels: 
      app.kubernetes.io/name: governify-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governify-registry
    spec:
      containers:
        - name: registry
          image: governifynext/registry:develop
          env:
            - {name: SERVICE_AUTHENTICATION_ENABLED, value: "true"}
            - {name: NODE_ENV, value: production}
            - {name: GOV_LOG_LEVEL, value: INFO}
            - {name: AUTHENTICATOR_SERVICE_URL, value: "http://governify-authenticator:5800"}
            - {name: CLIENT_ID, value: registry}
            - name: CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: registry_client_secret}}
            - {name: PORT, value: "5802"}
            - {name: GOV_SERVICE_NAME, value: registry}
            - {name: MONGO_URI, value: "mongodb://governify-mongo:27017/governify"}
            - {name: SCOPE_MANAGER_SERVICE_URL, value: "http://governify-scope-manager:5801"}
            - {name: COMPUTER_SERVICE_URL, value: "http://governify-computer:5803"}
            - {name: FETCHER_SERVICE_URL, value: "http://governify-fetcher:5804"}
            - {name: DIRECTOR_SERVICE_URL, value: "http://governify-director:5806"}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: jwt_secret}}
            - {name: JWT_ISSUER, value: authenticator}
            - {name: JWT_AUDIENCE, value: governify-next}
            # OAS telemetry: each service can override its own exporters and retention.
            - {name: OTEL_SERVICE_NAME, value: registry}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=governify-next-pre-production"}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom: {secretKeyRef: {name: governify-secrets, key: telemetry_otel_exporter_otlp_endpoint}}
            - {name: OASTLM_CONFIG_GENERAL_SPEC_FILE_NAME, value: "./src/docs/swagger.yaml"}
            - {name: OASTLM_CONFIG_TRACES_CAPTURE_BODY_MODE, value: onMismatchOrError}
            - {name: OASTLM_CONFIG_METRICS_RECORD_SCHEMA_COMPLIANCE, value: "true"}
            - {name: OASTLM_CONFIG_AUTH_ENABLED, value: "true"}
            - name: OASTLM_CONFIG_AUTH_PASSWORD
              valueFrom: {secretKeyRef: {name: governify-secrets, key: telemetry_oastlm_config_auth_password}}
            - name: OASTLM_CONFIG_AUTH_JWT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: telemetry_oastlm_config_auth_jwt_secret}}
            - {name: OASTLM_CONFIG_TRACES_MEMORY_EXPORTER_RETENTION_TIME_SECONDS, value: "36000"}
            - {name: OASTLM_CONFIG_METRICS_MAIN_READER_EXPORT_INTERVAL, value: "60000"}
            - {name: OASTLM_CONFIG_METRICS_MEMORY_EXPORTER_RETENTION_TIME_SECONDS, value: "172800"}
            - {name: OASTLM_CONFIG_LOGS_MEMORY_EXPORTER_RETENTION_TIME_SECONDS, value: "86400"}
            - name: OASTLM_CONFIG_AI_OPENAI_KEY
              valueFrom: {secretKeyRef: {name: governify-secrets, key: telemetry_oastlm_config_ai_openai_key}}
---
apiVersion: v1
kind: Service
metadata:
  name: governify-registry
spec:
  selector: 
    app.kubernetes.io/name: governify-registry
  ports:
    - {port: 5802}
