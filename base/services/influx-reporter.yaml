apiVersion: apps/v1
kind: Deployment
metadata:
  name: governify-influx-reporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: governify-influx-reporter
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governify-influx-reporter
    spec:
      containers:
        - name: influx-reporter
          image: governifynext/influx-reporter:develop
          ports:
            - name: http
              containerPort: 5808
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - {name: NODE_ENV, value: production}
            - {name: GOV_LOG_LEVEL, value: INFO}
            - {name: GOV_SERVICE_NAME, value: influx-reporter}
            - {name: PORT, value: "5808"}
            - {name: MONGO_URI, value: "mongodb://governify-mongo:27017/governify-influx-reporter"}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: "governify-kafka-bootstrap:9092"}
            - {name: KAFKA_CLIENT_ID, value: governify-influx-reporter}
            - {name: KAFKA_CONSUMER_GROUP_ID, value: governify-influx-reporter}
            - {name: STATE_EVENTS_TOPIC, value: governify.states.v1}
            - {name: INFLUX_URL, value: "http://governify-influxdb3:8181"}
            - name: INFLUX_TOKEN
              valueFrom: {secretKeyRef: {name: governify-secrets, key: influx_token}}
            - {name: INFLUX_DATABASE, value: governify-next}
            - {name: INFLUX_STATES_MEASUREMENT, value: states}
            - {name: INFLUX_STATE_METRICS_MEASUREMENT, value: state_metrics}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: governify-influx-reporter
spec:
  selector:
    app.kubernetes.io/name: governify-influx-reporter
  ports:
    - name: http
      port: 5808
      targetPort: http
