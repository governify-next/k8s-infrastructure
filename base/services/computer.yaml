apiVersion: apps/v1
kind: Deployment
metadata:
  name: governify-computer
spec:
  replicas: 2
  selector:
    matchLabels: 
      app.kubernetes.io/name: governify-computer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governify-computer
    spec:
      containers:
        - name: computer
          image: governifynext/computer:develop
          env:
            - {name: SERVICE_AUTHENTICATION_ENABLED, value: "true"}
            - {name: AUTHENTICATOR_SERVICE_URL, value: "http://governify-authenticator:5800"}
            - name: CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: computer_client_secret}}
            - {name: PORT, value: "5803"}
            - {name: GOV_SERVICE_NAME, value: computer}
            - {name: MONGO_URI, value: "mongodb://governify-mongo:27017/governify"}
            - {name: REDIS_URI, value: "redis://governify-redis:6379"}
            - {name: COLLECTOR_SERVICE_URL, value: "http://governify-fetcher:5804"}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: governify-secrets, key: jwt_secret}}
            - {name: REDIS_ENABLED, value: "true"}
---
apiVersion: v1
kind: Service
metadata:
  name: governify-computer
spec:
  selector: 
    app.kubernetes.io/name: governify-computer
  ports:
    - {port: 5803}
