apiVersion: apps/v1
kind: Deployment
metadata:
  name: governify-influxdb3
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: governify-influxdb3}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governify-influxdb3
    spec:
      containers:
        - name: influxdb3
          image: influxdb:3.9-core
          args:
            - influxdb3
            - serve
            - --node-id=governify-reporter
            - --object-store=file
            - --data-dir=/var/lib/influxdb3
            - --admin-token-file=/run/secrets/influxdb/admin-token.json
          volumeMounts:
            - {name: data, mountPath: /var/lib/influxdb3}
            - {name: token, mountPath: /run/secrets/influxdb, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: governify-influxdb3}
        - name: token
          secret:
            secretName: governify-secrets
            items:
              - {key: influx_admin_token.json, path: admin-token.json}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: governify-influxdb3
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 50Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: governify-influxdb3
spec:
  selector: {app.kubernetes.io/name: governify-influxdb3}
  ports:
    - {port: 8181}
