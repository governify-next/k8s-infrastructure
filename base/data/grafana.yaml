apiVersion: apps/v1
kind: Deployment
metadata:
  name: governify-grafana
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: governify-grafana}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governify-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.3.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: {secretKeyRef: {name: governify-secrets, key: grafana_user}}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: governify-secrets, key: grafana_password}}
            - {name: GF_SERVER_ROOT_URL, value: "https://grafana.k8s.next.governify.io"}
            - {name: GF_SECURITY_ALLOW_EMBEDDING, value: "true"}
            - {name: GF_SECURITY_COOKIE_SECURE, value: "true"}
            - {name: GF_SECURITY_COOKIE_SAMESITE, value: none}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: governify-grafana}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: governify-grafana
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: governify-grafana
spec:
  selector: {app.kubernetes.io/name: governify-grafana}
  ports:
    - {port: 3000}
