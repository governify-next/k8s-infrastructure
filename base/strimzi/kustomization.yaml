apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: governify-next
resources:
  - https://github.com/strimzi/strimzi-kafka-operator/releases/download/1.3.0/strimzi-cluster-operator-1.3.0.yaml
commonAnnotations:
  # Install the operator before infrastructure workloads (wave -2).
  argocd.argoproj.io/sync-wave: "-3"
patches:
  # CRDs have their own cluster-wide Argo CD Application.
  - target:
      kind: CustomResourceDefinition
    patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: strimzi-crd
  # Point the upstream RBAC subjects at the operator namespace.
  - target:
      kind: (Cluster)?RoleBinding
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: governify-next
