apiVersion: v1
kind: ServiceAccount
metadata:
  name: governify-headlamp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: governify-headlamp-admin
---
apiVersion: v1
kind: Secret
metadata:
  name: governify-headlamp-admin-token
  annotations:
    kubernetes.io/service-account.name: governify-headlamp-admin
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: governify-headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: governify-headlamp-admin
    namespace: governify-next
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: governify-headlamp
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: governify-headlamp}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governify-headlamp
    spec:
      serviceAccountName: governify-headlamp
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:latest
          args:
            - "-in-cluster"
            - "-plugins-dir=/headlamp/plugins"
          ports:
            - {containerPort: 4466, name: http}
          readinessProbe:
            httpGet: {path: /, port: 4466}
            initialDelaySeconds: 30
            timeoutSeconds: 30
          livenessProbe:
            httpGet: {path: /, port: 4466}
            initialDelaySeconds: 30
            timeoutSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: governify-headlamp
spec:
  selector: {app.kubernetes.io/name: governify-headlamp}
  ports:
    - {port: 80, targetPort: 4466}
