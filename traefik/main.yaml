apiVersion: v1
kind: Service
metadata:
  name: caddy-docker
  namespace: kube-system
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: https
      port: 8443
      targetPort: 8443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: caddy-docker
  namespace: kube-system
  labels:
    kubernetes.io/service-name: caddy-docker
addressType: IPv4
endpoints:
  - addresses:
      - 149.202.72.15
ports:
  - name: http
    port: 8080
    protocol: TCP
  - name: https
    port: 8443
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: governify-next-http
  namespace: kube-system
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`grafana.next.governify.io`)
      kind: Rule
      services:
        - name: caddy-docker
          port: 8080
    - match: Host(`scope-manager.next.governify.io`)
      kind: Rule
      services:
        - name: caddy-docker
          port: 8080
    - match: Host(`registry.next.governify.io`)
      kind: Rule
      services:
        - name: caddy-docker
          port: 8080
    - match: Host(`computer.next.governify.io`)
      kind: Rule
      services:
        - name: caddy-docker
          port: 8080
    - match: Host(`collector.next.governify.io`)
      kind: Rule
      services:
        - name: caddy-docker
          port: 8080
    - match: Host(`reporter.next.governify.io`)
      kind: Rule
      services:
        - name: caddy-docker
          port: 8080
    - match: Host(`director.next.governify.io`)
      kind: Rule
      services:
        - name: caddy-docker
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: governify-next-https
  namespace: kube-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`grafana.next.governify.io`)
      services:
        - name: caddy-docker
          port: 8443
    - match: HostSNI(`scope-manager.next.governify.io`)
      services:
        - name: caddy-docker
          port: 8443
    - match: HostSNI(`registry.next.governify.io`)
      services:
        - name: caddy-docker
          port: 8443
    - match: HostSNI(`computer.next.governify.io`)
      services:
        - name: caddy-docker
          port: 8443
    - match: HostSNI(`collector.next.governify.io`)
      services:
        - name: caddy-docker
          port: 8443
    - match: HostSNI(`reporter.next.governify.io`)
      services:
        - name: caddy-docker
          port: 8443
    - match: HostSNI(`director.next.governify.io`)
      services:
        - name: caddy-docker
          port: 8443
  tls:
    passthrough: true
